# Plex-overlay travel-friendly tmux config

# 256 colors + true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Fix annoying defaults
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# Easier prefix: keep Ctrl-b but also accept Ctrl-a
set -g prefix2 C-a
bind C-a send-prefix -2

# Easier splits (and they stay in cwd)
unbind %
unbind \"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config quickly
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar — show host + session + time
set -g status-style "bg=colour234,fg=colour245"
set -g status-left  "#[fg=colour39,bold]#H #[fg=colour245]| #[fg=colour255]#S "
set -g status-right "#[fg=colour245]%a %H:%M"
set -g status-left-length 40
set -g status-justify centre
