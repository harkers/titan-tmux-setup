# Plex-overlay travel-friendly tmux config

# 256 colors + true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Fix annoying defaults
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# Easier prefix: keep Ctrl-b but also accept Ctrl-a
set -g prefix2 C-a
bind C-a send-prefix -2

# Easier splits (and they stay in cwd)
unbind %
unbind \"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config quickly
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar — show host + session + time
set -g status-style "bg=colour234,fg=colour245"
set -g status-left  "#[fg=colour39,bold]#H #[fg=colour245]| #[fg=colour255]#S "
set -g status-right "#[fg=colour245]%a %H:%M"
set -g status-left-length 40
set -g status-justify centre

# ─── Plugins (tpm) ──────────────────────────────────────────────
# Survive reboots: continuum auto-saves layouts every 15 min,
# resurrect restores them when tmux starts.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Indicator: status-right shows resurrect/continuum state when active.
set -g status-right "#{continuum_status} #[fg=colour245]%a %H:%M"

# Initialize tpm — must be the LAST line.
run '~/.tmux/plugins/tpm/tpm'
