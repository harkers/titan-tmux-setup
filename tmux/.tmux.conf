# Plex-overlay travel-friendly tmux config

# 256 colors + true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Fix annoying defaults
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# Easier prefix: keep Ctrl-b but also accept Ctrl-a
set -g prefix2 C-a
bind C-a send-prefix -2

# Easier splits (and they stay in cwd)
unbind %
unbind \"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config quickly
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Popup session picker (fzf). Prefix + T opens a centred floating picker.
bind T display-popup -E -w 60% -h 60% \
    "tmux list-sessions -F '#{session_name}' \
        | grep -v \"^$(tmux display-message -p '#S')\$\" \
        | fzf --reverse --header='switch session' \
        | xargs -r tmux switch-client -t"

# SSH agent: panes use a stable socket path that survives detach/reattach.
# Pair with a shell-rc snippet that maintains the symlink — see tmux/README.md.
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION SSH_CLIENT DISPLAY TERM_PROGRAM"
setenv -g SSH_AUTH_SOCK "$HOME/.ssh/agent.sock"

# ─── Plugins (tpm) ──────────────────────────────────────────────
# Survive reboots: continuum auto-saves layouts every 15 min,
# resurrect restores them when tmux starts.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank: selections go to the system clipboard (pbcopy on Mac, xclip/xsel on Linux).
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

# tmux-prefix-highlight colours
set -g @prefix_highlight_fg 'colour234'
set -g @prefix_highlight_bg 'colour39'
set -g @prefix_highlight_prefix_prompt 'PREFIX'

# Status bar — host + session + prefix indicator + battery (Mac) + continuum + time
set -g status-style "bg=colour234,fg=colour245"
set -g status-left  "#[fg=colour39,bold]#H #[fg=colour245]| #[fg=colour255]#S #{prefix_highlight}"
set -g status-right "#{continuum_status} #{battery_icon} #{battery_percentage} #[fg=colour245]%a %H:%M"
set -g status-left-length 60
set -g status-right-length 80
set -g status-justify centre

# Initialize tpm — must be the LAST line.
run '~/.tmux/plugins/tpm/tpm'
