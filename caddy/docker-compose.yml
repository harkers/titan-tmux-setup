services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    # network_mode: host so 127.0.0.1:* reverse_proxies hit titan-local services
    # without leaving the host network stack. Caddy listens on :80 only.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
